[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zhong86", email = "billy3rlvin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "click==8.5.0",
    "defusedxml>=0.7.1",
    "fastapi==0.141.1",
    "h11==0.16.0",
    "httptools==0.8.0",
    "httpx>=0.28.1",
    "idna==3.20",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "starlette==1.7.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn[standard]==0.54.0",
    "uvloop==0.22.1; platform_python_implementation != 'PyPy' and sys_platform != 'cygwin' and sys_platform != 'win32'",
    "watchfiles==1.3.0",
    "websockets==17.1",
]

[project.scripts]
backend = "main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["main", "api", "core", "graph", "schemas", "services"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-repeat>=0.9.3",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
